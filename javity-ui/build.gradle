def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch')
def arm = arch in ['aarch64', 'arm64']
def nativeOs = os.contains('win') ? 'windows' : os.contains('mac') ? 'macos' : 'linux'
def natives = "natives-$nativeOs" + (arm ? '-arm64' : '')

dependencies {
    api project(':javity-core')
    api "com.badlogicgames.gdx:gdx:${rootProject.gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${rootProject.gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-desktop"
    implementation platform('org.lwjgl:lwjgl-bom:3.4.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-yoga'
    runtimeOnly "org.lwjgl:lwjgl:3.4.3:$natives"
    runtimeOnly "org.lwjgl:lwjgl-yoga:3.4.3:$natives"
}
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
