dependencies {
    api project(':javity-core')
    api "com.badlogicgames.gdx:gdx:${rootProject.gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${rootProject.gdxVersion}"

    // The public UI jar remains portable. Tests exercise the desktop provider directly.
    testRuntimeOnly project(':javity-ui-yoga-lwjgl')
    testRuntimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-desktop"
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
