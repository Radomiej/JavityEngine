plugins { id 'base' }

ext {
    gdxVersion = '1.14.2'
    artemisVersion = '2.3.0'
    lwjglVersion = '3.4.3'
}

subprojects {
    apply plugin: 'java-library'
    group = 'pl.javity'
    version = '0.7.0-SNAPSHOT'

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
    tasks.withType(Test).configureEach { useJUnit() }
    dependencies { testImplementation 'junit:junit:4.13.2' }
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.badlogicgames.gdx' &&
                details.requested.name in ['gdx', 'gdx-box2d', 'gdx-freetype',
                    'gdx-backend-lwjgl3', 'gdx-backend-headless', 'gdx-platform',
                    'gdx-box2d-platform', 'gdx-freetype-platform']) {
                details.useVersion rootProject.gdxVersion
            }
            if (details.requested.group == 'org.lwjgl') {
                details.useVersion rootProject.lwjglVersion
            }
        }
    }
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.named('clean') { dependsOn subprojects.collect { it.tasks.named('clean') } }
