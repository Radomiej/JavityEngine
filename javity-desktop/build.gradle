apply plugin: 'application'

application {
    mainClass = 'org.javity.demo.DesktopLauncher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
tasks.withType(JavaExec).configureEach {
    workingDir rootProject.projectDir
}
// The native comparison demo also runs from installDist outside the checkout.
tasks.named('processResources') {
    from(rootProject.file('web/javity-ui-reference')) {
        include 'fixture.json', 'reference-metrics.json', 'k1-controls-fixture.json', 'k2-wrap-fixture.json',
                'k4-image-fixture.json', 'k4-image-fixture.png', 'mm-fixture.json'
        into 'org/javity/demo/ui-reference'
    }
}
dependencies {
    implementation project(':javity-engine')
    implementation project(':javity-ui')
    implementation project(':javity-script')
    implementation project(':javity-core')
    implementation project(':javity-map-core')
    implementation project(':javity-maplibre')
    implementation project(':javity-voxel')
    implementation project(':javity-physics2d')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${rootProject.gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${rootProject.gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:${rootProject.gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${rootProject.gdxVersion}:natives-desktop"
}
tasks.register('smoke', JavaExec) {
    group = 'verification'
    description = 'Run the actual Javity desktop scene for 120 frames.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args '--smoke'
}

tasks.register('mapSmoke', JavaExec) {
    group = 'verification'
    description = 'Run offline geographic map and font smoke with real OpenGL.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args '--map', '--smoke'
}

