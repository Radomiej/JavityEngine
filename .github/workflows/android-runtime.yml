name: Android full instrumentation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build app and instrumentation APKs once
        run: >-
          ./gradlew --no-daemon --console=plain -PjavityAndroid=true
          :javity-android-app:assembleDebug
          :javity-android-app:assembleDebugAndroidTest
      - name: Prepare diagnostic artifact directory
        if: always()
        run: mkdir -p artifacts/android-full-suite
      - name: Enable KVM for the hosted emulator
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run the complete connected instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/android-full-suite.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-full-instrumentation-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/android-full-suite/**
            javity-android-app/build/outputs/androidTest-results/**
            javity-android-app/build/reports/androidTests/**
            javity-android-app/build/reports/tests/**
            javity-android-app/build/outputs/apk/debug/**
            javity-android-app/build/outputs/apk/androidTest/debug/**
